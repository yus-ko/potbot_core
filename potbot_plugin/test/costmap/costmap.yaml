map_server:
  ros__parameters:
    yaml_filename: "/root/ros2_ws/warehouse.yaml"

costmap:
  costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.2
      resolution: 0.05
      track_unknown_space: true
      plugins: [
        "static_layer", 
        "human_pose_layer",
        "inflation_layer"
        ]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      human_pose_layer:
        plugin: "potbot_plugin::HumanPoseLayer"
        enabled: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True