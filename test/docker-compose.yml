x-common-setting: &common_setting
  build:
      context: .
      dockerfile: ./Dockerfile
  image: ros/potbot:humble
  network_mode: bridge
  stdin_open: true
  tty: true

x-common-environment: &common_environment
  TERM:
  DISPLAY:
  TURTLEBOT3_MODEL: waffle_pi

services:

  gazebo:
    profiles: [pipeline]
    <<: *common_setting
    container_name: gazebo
    environment:
      <<: *common_environment
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./.gazebo:/root/.gazebo
      - ../../../:/root/ros2_ws
      - ./entrypoint.sh:/entrypoint.sh
    entrypoint: /entrypoint.sh
    command: ros2 launch potbot_example turtlebot3_with_garage.launch.py

  domain_bridge:
    profiles: [pipeline]
    <<: *common_setting
    container_name: domain_bridge
    volumes:
     - ./bridge_config.yaml:/bridge_config.yaml
    command: ros2 run domain_bridge domain_bridge /bridge_config.yaml

  potbot:
    profiles: [pipeline]
    <<: *common_setting
    container_name: potbot
    environment:
      <<: *common_environment
      ROS_DOMAIN_ID: 1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../../../:/root/ros2_ws
      - ./entrypoint.sh:/entrypoint.sh
      - ./:/root/test
    entrypoint: /entrypoint.sh
    command: ros2 launch /root/test/turtlebot3_navigation.launch.py use_sim_time:=true

  nav-test:
    profiles: [pipeline]
    <<: *common_setting
    container_name: nav-test
    environment:
      <<: *common_environment
      ROS_DOMAIN_ID: 1
    depends_on:
      - potbot
    volumes:
      - ../../../:/root/ros2_ws
      - ./entrypoint.sh:/entrypoint.sh
      - ./:/root/test
    entrypoint: /entrypoint.sh
    command: bash /root/test/run_navigation_test.sh

  rosbag-record:
    profiles: [pipeline]
    <<: *common_setting
    container_name: rosbag-record
    environment:
      <<: *common_environment
      ROS_DOMAIN_ID: 1
    depends_on:
      - potbot
    volumes:
      - ../../../:/root/ros2_ws
      - ./entrypoint.sh:/entrypoint.sh
      - ./:/root/test
    entrypoint: /entrypoint.sh
    # センチネルファイル (.stop_rosbag) 検知で記録を停止するラッパースクリプトを使用
    command: bash /root/test/rosbag_record_wrapper.sh

  rosbag-analysis:
    profiles: [analysis]
    <<: *common_setting
    container_name: rosbag-analysis
    volumes:
      - ./:/root/test
    entrypoint: /bin/bash
    command: -c "python3 /root/test/analyze_rosbag.py --bag-path /root/test/results/rosbag2 --output-dir /root/test/results"

  pytest:
    profiles: [test]
    <<: *common_setting
    container_name: pytest
    volumes:
      - ./:/root/test
    entrypoint: /bin/bash
    command: -c "cd /root/test && python3 -m pytest test_analyze_rosbag.py -v"

  colcon-test:
    profiles: [test]
    <<: *common_setting
    container_name: colcon-test
    environment:
      ROS_DISTRO: humble
      TURTLEBOT3_MODEL: waffle_pi
    volumes:
      - ../../../:/root/ros2_ws
    # entrypoint.sh は install/setup.bash を事前に source するため上書き
    entrypoint: /bin/bash
    # potbot_example は Gazebo が必要な E2E テストのみのためスキップ
    # 古いテスト結果を削除してから実行することで test-result に混入しない
    command: >
      -c "source /opt/ros/humble/setup.bash
      && cd /root/ros2_ws
      && colcon build
      && source install/setup.bash
      && rm -rf build/potbot_example/test_results build/potbot_example/Testing
      && colcon test --packages-skip potbot_example
      && colcon test-result --verbose"

